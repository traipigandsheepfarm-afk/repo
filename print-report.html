<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบบันทึกการปฏิบัติงานประจำวัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --text: #111827;
        --border: #000000;
        --muted: #6b7280;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Sarabun', 'TH Sarabun New', sans-serif;
        background: #e5e7eb;
        color: var(--text);
        padding: 1.5rem;
        font-size: 16px;
    }

    .toolbar {
        max-width: 850px;
        margin: 0 auto 1rem;
        display: flex;
        justify-content: flex-end;
        gap: 0.75rem;
    }
    .toolbar button {
        padding: 0.65rem 1.4rem;
        border-radius: 8px;
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        border: none;
    }
    .btn-print { background: #2563eb; color: white; }
    .btn-close { background: white; color: var(--text); border: 1px solid #cbd5e1; }

    .doc-page {
        max-width: 850px;
        margin: 0 auto;
        background: white;
        padding: 1.6rem 2.1rem;
        box-shadow: 0 4px 18px rgba(0,0,0,0.15);
    }

    .doc-title {
        text-align: center;
        font-weight: 700;
        font-size: 1.1rem;
        line-height: 1.45;
        margin-bottom: 0.5rem;
    }
    .doc-meta-line {
        text-align: center;
        font-size: 0.98rem;
        margin-bottom: 0.1rem;
    }

    table.doc-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 0.9rem;
    }
    table.doc-table th, table.doc-table td {
        border: 1px solid var(--border);
        padding: 0.5rem 0.7rem;
        vertical-align: top;
        font-size: 0.92rem;
    }
    table.doc-table th {
        text-align: center;
        font-weight: 700;
        background: #f3f4f6;
    }
    .time-cell {
        text-align: center;
        font-weight: 600;
        width: 105px;
        white-space: nowrap;
    }

    .cat-title { font-weight: 700; margin-top: 0.5rem; margin-bottom: 0.25rem; }
    .cat-title:first-child { margin-top: 0; }
    .check-list { list-style: none; margin-bottom: 0.3rem; }
    .check-list li { margin-bottom: 0.15rem; line-height: 1.4; }

    .assessment-block { margin-top: 0.8rem; border-top: 1px dashed #9ca3af; padding-top: 0.5rem; }
    .assessment-block .assess-title { font-weight: 700; margin-bottom: 0.25rem; }
    .assessment-text { white-space: pre-wrap; line-height: 1.45; }

    .empty-note { color: var(--muted); font-style: italic; }

    .sign-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-top: 1.5rem;
        font-size: 0.9rem;
        line-height: 1.7;
    }
    .sig-block {
        width: fit-content;
        max-width: 100%;
        margin: 0 auto;
        text-align: center;
    }
    .sig-line-grid {
        display: grid;
        grid-template-columns: auto auto auto;
        align-items: end;
        column-gap: 0.3rem;
        white-space: nowrap;
    }
    .sig-line-grid .dots { letter-spacing: 0.1em; }
    .sig-name-row {
        grid-column: 2;
        text-align: center;
        margin-top: 0.1rem;
    }
    .sig-date-row { text-align: center; margin-top: 0.1rem; }

    .approval-block {
        margin-top: 1.3rem;
        padding-top: 0.75rem;
        border-top: 1px solid var(--border);
        font-size: 0.92rem;
        line-height: 1.6;
    }
    .cm-sign-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        margin-top: 1.2rem;
    }
    .cm-sign-photo {
        width: 180px;
        height: 180px;
        object-fit: cover;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        flex-shrink: 0;
    }

    .print-footer-note {
        text-align: right;
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 1rem;
    }

    @media print {
        body { background: white; padding: 0; font-size: 14px; }
        .toolbar { display: none; }
        .doc-page { box-shadow: none; max-width: 100%; padding: 0.4cm 0.6cm; }
        table.doc-table, .sign-row, .approval-block { break-inside: avoid; }
        @page { size: A4; margin: 1cm; }
    }

    @media (max-width: 640px) {
        .doc-page { padding: 1.25rem; }
        table.doc-table th, table.doc-table td { font-size: 0.85rem; padding: 0.45rem; }
        .sign-row { grid-template-columns: 1fr; }
        .cm-sign-row { flex-direction: column; }
    }
</style>
</head>
<body>

<div class="toolbar">
    <button class="btn-close" onclick="window.close()">← ปิดหน้านี้</button>
    <button class="btn-print" onclick="window.print()">🖨️ พิมพ์ / บันทึกเป็น PDF</button>
</div>

<div class="doc-page" id="docPage">
    <div style="text-align:center; padding: 3rem 1rem; color:#6b7280;" id="loadingNote">กำลังโหลดข้อมูล...</div>
</div>

<script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycby8_WCN_ZsB8xNDpDHMHsuAx6mksZvDcijNdJORVzkhmOl6OIGlmcSyHECRbHAZDIJM/exec';

    const CATEGORY_ITEMS = {
        1: ['วัดสัญญาณชีพ','การฟื้นฟูสภาพ','การทำกายภาพบำบัด','ดูแลด้านยา','ดูแลด้านโภชนาการ',
            'นวดกระตุ้นระบบไหลเวียน','ฝึกบริหารสมอง','บริหารข้อและกล้ามเนื้อ','พลิกตะแคงตัว',
            'จัดท่านอนที่เหมาะสม','ดูแลทำแผล','ดูแลสายสวนปัสสาวะ','การให้ออกซิเจน','ปฐมพยาบาล',
            'ดูแลการดูดเสมหะ','การช่วยฟื้นคืนชีพ','ดูแลสุขภาพช่องปาก','ประเมิน 2Q','ประเมิน 9Q','ประเมิน 8Q'],
        2: ['ดูแลความสะอาดด้านร่างกาย','ดูแลด้านการกินยา','ดูแลเรื่องการกินอาหาร'],
        3: ['จัดบ้าน/ที่อยู่อาศัยให้เป็นระเบียบ','ทำความสะอาดบ้าน/ที่อยู่อาศัย','จัดสภาพแวดล้อมบ้าน/ที่อยู่อาศัย'],
        4: ['ประเมิน ADL','ประเมินภาวะสมองเสื่อม','นวดท้อง','ให้คำแนะนำเรื่องอาหารที่เหมาะสม',
            'ทาโลชั่นน้ำมันมะกอก','ประเมินความก้าวหน้า','ประเมินภาวะโภชนาการ','ประเมินความถูกต้องการใช้ยา',
            'แนะนำอาหารกระตุ้นการขับถ่าย','ประเมินภาวะเครียด ST5','ประเมิน TAI I1-i3 C2-C4 B3-B5',
            'ฝึกการกลั้นปัสสาวะ','ประเมินภาวะสมองเสื่อม AMT','ประเมินแผลกดทับ','การจัดท่านอนป้องกันปลายเท้าตก',
            'การเคลื่อนย้ายบนเตียงลงจากเตียง','กระตุ้นไปวัด']
    };
    const CATEGORY_TITLES = {
        1: '1. การบริการสาธารณสุขเบื้องต้น',
        2: '2. การดูแลสุขภาพขั้นพื้นฐาน',
        3: '3. การจัดการสภาพแวดล้อม/บ้าน/ที่อยู่อาศัย',
        4: '4. การดูแลด้านอื่นๆ'
    };
    const MONTHS_TH = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

    function esc(str) {
        if (str === undefined || str === null) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function roleLabel(role) {
        return role === 'CG' ? 'Caregiver' : 'สหวิชาชีพ';
    }

    function thaiDateParts(dateStr) {
        if (!dateStr) return { day: '.....', month: '.....', year: '.....' };
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return { day: '.....', month: '.....', year: '.....' };
        return { day: d.getDate(), month: MONTHS_TH[d.getMonth()], year: d.getFullYear() + 543 };
    }

    function buildCategoryHtml(catNum, activities, vitals) {
        const items = CATEGORY_ITEMS[catNum].filter(item => activities.indexOf(item) !== -1);
        if (items.length === 0) return '';
        let html = `<div class="cat-title">${CATEGORY_TITLES[catNum]}</div><ul class="check-list">`;
        items.forEach(item => {
            if (catNum === 1 && item === 'วัดสัญญาณชีพ') {
                const parts = [];
                if (vitals.bp) parts.push(`ความดันโลหิต ${esc(vitals.bp)} mmHg`);
                if (vitals.pulse) parts.push(`ชีพจร ${esc(vitals.pulse)} ครั้ง/นาที`);
                if (vitals.sugar) parts.push(`น้ำตาลในเลือด ${esc(vitals.sugar)} mg/dl`);
                html += `<li>☑ สัญญาณชีพ${parts.length ? ' ' + parts.join('  ') : ''}</li>`;
            } else {
                html += `<li>☑ ${esc(item)}</li>`;
            }
        });
        html += `</ul>`;
        return html;
    }

    function signBlockHtml(prefix, suffix, nameLine, dateLine) {
        return `
            <div class="sig-line-grid">
                <span>${prefix}</span><span class="dots">....................</span><span>${suffix}</span>
            </div>
            <div class="sig-name-row">${nameLine}</div>
            ${dateLine ? `<div class="sig-date-row">${dateLine}</div>` : ''}
        `;
    }

    async function apiGet(action, params) {
        params = params || {};
        const url = new URL(WEB_APP_URL);
        url.searchParams.set('action', action);
        Object.keys(params).forEach(k => url.searchParams.set(k, params[k]));
        const res = await fetch(url.toString());
        return res.json();
    }

    async function render() {
        const raw = localStorage.getItem('reportData');
        const docPage = document.getElementById('docPage');

        if (!raw) {
            docPage.innerHTML = `<div style="text-align:center;padding:3rem 1rem;color:#6b7280;">
                ไม่พบข้อมูลรายงาน กรุณากลับไปกรอกแบบฟอร์มและกด "ดูตัวอย่างรายงาน" อีกครั้ง</div>`;
            return;
        }

        let data;
        try {
            data = JSON.parse(raw);
        } catch (e) {
            docPage.innerHTML = `<div style="text-align:center;padding:3rem 1rem;color:#6b7280;">ไม่สามารถอ่านข้อมูลรายงานได้</div>`;
            return;
        }

        // role อาจมาจาก reportData หรือ sessionStorage (กรณีเปิดแท็บใหม่จากแท็บเดียวกัน)
        const role = data.role || sessionStorage.getItem('userRole') || 'สหวิชาชีพ';
        const rLabel = roleLabel(role);

        const activities = (data.activities || '').split(',').map(a => a.trim()).filter(Boolean);
        const vitals = { bp: data.bloodPressure, pulse: data.pulse, sugar: data.bloodSugar };

        const col2Html = [1, 2, 3].map(c => buildCategoryHtml(c, activities, vitals)).join('') ||
            `<span class="empty-note">ไม่มีข้อมูลกิจกรรม</span>`;
        const col4Html = buildCategoryHtml(4, activities, vitals);

        const assessmentHtml = `
            <div class="assessment-block">
                <div class="assess-title">5. ผลการประเมิน</div>
                <div class="assessment-text">${data.assessment ? esc(data.assessment) : '<span class="empty-note">-</span>'}</div>
            </div>`;

        const dateParts = thaiDateParts(data.visitDate);
        const monthOnly = (data.monthYear || '').split(' ')[0] || '';
        document.title = `รายงาน ${data.elderlyName || ''} ${data.visitDate || ''}`.trim();

        const photos = data.images || [];
        const firstPhotoHtml = photos.length
            ? `<img class="cm-sign-photo" src="${photos[0]}" alt="ภาพประกอบการให้บริการ">`
            : '';

        // ดึงชื่อ CM ปัจจุบันมาแสดงในช่องผู้รับรอง
        let cmName = '.....................................................';
        try {
            const cmRes = await apiGet('getStaffList', { role: 'CM' });
            if (cmRes.success && cmRes.data.length > 0) cmName = cmRes.data[0].name;
        } catch (e) { /* ใช้ค่าเริ่มต้นถ้าดึงไม่สำเร็จ */ }

        // ดึงชื่อผู้ดูแลในครอบครัว มาใส่แทนจุดไข่ปลาในช่องลงชื่อผู้ดูแลผู้สูงอายุ
        let familyName = null;
        if (data.elderlyId) {
            try {
                const famRes = await apiGet('getFamily', { elderlyId: data.elderlyId });
                if (famRes.success && famRes.data.length > 0) familyName = famRes.data[0].name;
            } catch (e) { /* ใช้จุดไข่ปลาถ้าดึงไม่สำเร็จ */ }
        }
        const familySignName = familyName ? esc(familyName) : '.................................................';

        docPage.innerHTML = `
            <div class="doc-title">
                แบบบันทึกการปฏิบัติงานประจำวันของผู้ดูแลผู้สูงอายุ(${esc(rLabel)})<br>
                ศูนย์พัฒนาคุณภาพชีวิตผู้สูงอายุและคนพิการตำบลทุ่งหลวง
            </div>
            <div class="doc-meta-line">
                ประจำเดือน${esc(monthOnly)}&nbsp;&nbsp;&nbsp;&nbsp;
                ชื่อ-สกุล (${esc(rLabel)}) ${esc(data.caregiverName)}&nbsp;&nbsp;&nbsp;&nbsp;
                ชื่อ-สกุล ผู้สูงอายุ ${esc(data.elderlyName)}
            </div>
            <div class="doc-meta-line">วันที่ ${dateParts.day} เดือน ${dateParts.month} พ.ศ. ${dateParts.year}</div>

            <table class="doc-table">
                <thead>
                    <tr>
                        <th>ว/ด/ป<br>เวลา</th>
                        <th>กิจกรรมดูแลช่วยเหลือ</th>
                        <th>กิจกรรมดูแลช่วยเหลือ</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="time-cell">${esc(data.visitDate)}<br>${esc(data.startTime)}-${esc(data.endTime)} น.</td>
                        <td>${col2Html}</td>
                        <td>${col4Html || '<span class="empty-note">ไม่มีข้อมูล</span>'}${assessmentHtml}</td>
                    </tr>
                </tbody>
            </table>

            <div class="sign-row">
                <div class="sig-block">
                    ${signBlockHtml('ลงชื่อ', esc(rLabel), `(${esc(data.caregiverName)})`, `วันที่ ${dateParts.day} เดือน ${dateParts.month} พ.ศ. ${dateParts.year}`)}
                </div>
                <div class="sig-block">
                    <div style="margin-bottom:0.3rem;">ขอรับรองว่าได้ปฏิบัติงานตามรายงานข้างต้นจริง</div>
                    ${signBlockHtml('ลงชื่อ', 'ผู้ดูแลผู้สูงอายุ', `(${familySignName})`, `วันที่ ${dateParts.day} เดือน ${dateParts.month} พ.ศ. ${dateParts.year}`)}
                </div>
            </div>

            <div class="approval-block">
                เรียน ประธานคณะกรรมการศูนย์พัฒนาคุณภาพชีวิตผู้สูงอายุและคนพิการตำบลทุ่งหลวง<br>
                &nbsp;&nbsp;- เพื่อโปรดทราบ/พิจารณา<br>
                &nbsp;&nbsp;- ได้ตรวจสอบแล้ว รับรองว่าถูกต้อง หรือเห็นสมควรประการใด โปรดพิจารณาสั่งการ
                <div class="cm-sign-row">
                    <div class="sig-block">
                        ${signBlockHtml('ลงชื่อ', 'ผู้รับรอง/(Care manager)', `(${esc(cmName)})`)}
                    </div>
                    ${firstPhotoHtml}
                </div>
            </div>
        `;
    }

    render();
</script>

</body>
</html>
